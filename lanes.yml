# iv-suggest lanes. One lane = one playlist + the rules that fill it; adding a
# genre is a new block below, not new code.
#
# Every key is documented once, in docs/CONFIG.md. The comments here only say
# why THIS instance chose THESE values.

blocklist:
  playlist: Blocked
  channels: []

# Every account on the instance, including ones registered later. `min_watched`
# below is what stops a new account being handed a dozen playlists it cannot
# fill; `household` is what it gets in the meantime.
auto_enrol:
  lanes: all
  exclude: []

# Listing somebody gives them different lanes. It is not how they opt in.
#users:
#  - email: them@example.com
#    lanes: [suggested, music-discover, fresh-uploads]
#    overrides:
#      fresh-uploads: {size: 15}

defaults:
  size: 30
  ttl_days: 14
  cooldown_days: 60
  watched_cooldown_days: 365
  rotate_cooldown_days: 21
  max_per_channel: 2
  exclude_watched: true
  exclude_subscribed: true
  dedupe_across_lanes: true
  min_seconds: 120              # drops Shorts
  privacy: unlisted             # a lane is a record of what somebody watches
  # Every lane here seeds from watch history, so below this it returns nothing
  # worth showing. `household` overrides it to 0 and carries the account until
  # the history is there.
  min_watched: 50

  # Tuned by simulation over 72 hourly ticks: ~3.4 new videos in the visible top
  # 10 each hour on a 30-video lane. The first draft (fatigue 0.75 / jitter 0.15)
  # replaced 8.5 of 10 an hour, which reads as random rather than refreshed.
  shuffle:
    visible: 10
    fatigue: 0.95
    fatigue_cap: 8
    recency_boost: 1.0
    recency_halflife: 12.0
    jitter: 0.08
    diversity: true
    round_robin_top: true

lanes:
  - id: suggested
    title: "Suggested"
    seed: {limit: 30, recent: 10, shuffle_window: 300}
    expand: recommended
    refresh_per_day: 5          # ~6 day rotation of the whole 30
    sample_pool: 40
    keep_min: 20                # never rotate below this, even on a thin night

  # last_played holds the N most recently PLAYED, so it reads none of the
  # candidate rules: no ttl, no exclude_watched, no per-channel cap. Setting
  # them here did nothing and the run now says so.
  - id: music-watched
    title: "Music: watched"
    policy: last_played
    seed: {scan: 700, genre: Music}
    size: 100
    fetch_cap: 150              # fills over about 3 nights, then costs nothing
    # 100 videos competing for 10 visible slots churn the top far harder than a
    # 30 lane; a proportionally wider window brings it back to ~3.7/hour.
    shuffle: {visible: 40}

  - id: music-discover
    title: "Music: discover"
    # shuffle_window 700 matches what music-watched already caches, so a
    # shuffled seed almost never costs an extra genre fetch.
    seed: {limit: 15, scan: 300, genre: Music, shuffle_window: 700}
    expand: recommended
    filter: {genre: Music}
    exclude_watched: false      # re-hearing a good song is fine
    min_seconds: 60
    max_seconds: 900            # drops the one hour "mega hits" compilations
    max_per_channel: 2
    refresh_per_day: 4
    rotate_cooldown_days: 14    # the Music candidate pool is small, recycle sooner
    sample_pool: 30
    keep_min: 20

  # Channels watched but never subscribed to. Everything else in this file
  # recycles videos that already existed; this lane reads what those channels
  # published since yesterday. ~60 uploads per fetch, ~a dozen fetches a refill.
  - id: fresh-uploads
    title: "Fresh uploads"
    seed: {limit: 400}
    expand: channel_latest
    size: 25
    ttl_days: 10
    refresh_per_day: 4
    max_channels: 16
    max_age_days: 30
    max_per_channel: 2
    # 16 channels at one fetch each, plus headroom for the retries a channel
    # listing now takes: at 20 the cap bound mid-lane on a rate-limited night
    # and the lane read about half its channels.
    fetch_cap: 30

  # The 5 biggest things the subscriptions put out in the last 48 hours. Every
  # other lane excludes subscribed channels; this one is the deliberate
  # exception, which is why exclude_subscribed is off.
  - id: subs-top48
    title: "Subscriptions: biggest 48h"
    expand: subscription_feed
    subscription: {kinds: [video], max_age_hours: 48, rank: views}
    size: 5
    ttl_days: 2                 # nothing here stays past the window
    refresh_per_day: 5          # the whole lane cycles every night
    keep_min: 0
    exclude_subscribed: false
    max_per_channel: 1          # 5 slots, so one per channel keeps it varied
    cooldown_days: 7
    rotate_cooldown_days: 3
    dedupe_songs: false

  # The recommendation graph restricted to the last fortnight. `suggested` takes
  # the whole graph and mostly returns older videos. NOT a home-mix source.
  - id: new-for-you
    title: "New for you"
    seed: {limit: 30, recent: 10, shuffle_window: 300}
    expand: recommended
    recommend_max_age_days: 14
    size: 30
    ttl_days: 7                 # a fortnight-old ceiling needs a short TTL
    refresh_per_day: 6
    sample_pool: 40
    keep_min: 15

  # Shorts are out of the subscription feed (feed_kinds: [video]) but not thrown
  # away — they land here instead.
  - id: subs-shorts
    title: "Shorts"
    expand: subscription_feed
    subscription: {kinds: [short], max_age_hours: 168, rank: views}
    size: 30
    ttl_days: 7
    refresh_per_day: 0          # window-bounded lane: max_age_hours IS the turnover
    exclude_subscribed: false
    min_seconds: 0              # the whole point of this lane
    max_per_channel: 3
    dedupe_songs: false

  # Live streams, newest first rather than biggest: a stream is worth seeing
  # because it is on or just finished, not because it is popular.
  - id: subs-live
    title: "Live streams"
    expand: subscription_feed
    subscription: {kinds: [live], max_age_hours: 720, rank: published}
    # Only 35 of the 75 channels ever stream: size 20 filled to 3.
    size: 10
    ttl_days: 21
    refresh_per_day: 0          # window-bounded, same as subs-shorts
    exclude_subscribed: false
    min_seconds: 0
    # 1: a channel that re-streams reuses the title verbatim, so any higher
    # cap puts the same stream name in the lane twice. One per channel over a
    # 30-day window supplies about 7 distinct streams, which clears the 50%
    # underfilled floor without the repeats.
    max_per_channel: 1
    dedupe_songs: false

  # Interest lanes, same shape as music-discover. Playlists only — none of these
  # feed the front page.
  #
  # shuffle_window 700: the most recent 700 history entries are fully
  # genre-cached, so seeding costs zero fetches.
  # size 20, not 30: the genre check is one fetch per candidate. Three lanes at
  # 30 would want ~270 checks on the first fill and blow the 320-fetch budget.

  - id: gaming
    title: "Gaming"
    seed: {limit: 15, scan: 300, genre: "Gaming", shuffle_window: 700}
    expand: recommended
    filter: {genre: "Gaming"}
    size: 20
    refresh_per_day: 4
    sample_pool: 30
    keep_min: 12
    fetch_cap: 60

  - id: autos
    title: "Cars"
    seed: {limit: 15, scan: 300, genre: "Autos & Vehicles", shuffle_window: 700}
    expand: recommended
    filter: {genre: "Autos & Vehicles"}
    size: 20
    refresh_per_day: 4
    sample_pool: 30
    keep_min: 12
    fetch_cap: 60

  - id: sci-tech
    title: "Science & tech"
    seed: {limit: 15, scan: 300, genre: "Science & Technology", shuffle_window: 700}
    expand: recommended
    filter: {genre: "Science & Technology"}
    size: 20
    refresh_per_day: 4
    sample_pool: 30
    keep_min: 12
    fetch_cap: 60

  # One person's whole front page, and the source `popular` compiles from.
  # Spec: ~10% music, the rest recommendation driven.
  #
  # size 54 is what the shares and the source sizes agree on: suggested supplies
  # its full 30, fresh-uploads 19 of its 25, music 5. Growing `suggested` or
  # `fresh-uploads` is what makes the page longer; raising `size` alone would
  # only pull in more music.
  - id: home-mix
    title: "Home mix"
    policy: mix
    size: 54
    mix:
      # A bigger head makes the other sources catch up in one block right after
      # it. 5 holds the longest run to 2 and puts the first music video at
      # position 8 — just off the first screen on the TV.
      pure: 5
      sources:
        - {lane: suggested, share: 0.50}
        - {lane: fresh-uploads, share: 0.30}
        # 0.10 of 54 = 5.4, so about the 5 asked for
        - {lane: subs-top48, share: 0.10}
        - {lane: music-discover, share: 0.10}
      # A source may name another account, which makes this the household feed:
      #   - {user: them@example.com, lane: suggested, share: 0.2}

  # THE PUBLIC FEEDS: what popular_playlists and trending_playlists point at.
  # One playlist each for the whole instance, compiled from every account's mix
  # and weighted by how many of them hold a video, so agreement decides the top
  # rather than any one person's taste. `privacy: public` because a logged-out
  # visitor is the audience; no watch-history filter, because there is no one
  # viewer whose history it could be. Zero fetches: both read lanes that are
  # already in the database.
  #
  # Exactly one account holds a consensus lane and the engine decides which, so
  # there is no way to spell a second copy: an override may not change a
  # policy, and neither form of auto_enrol hands one out. A `users:` entry
  # naming the lane claims it; otherwise it lands on IV_SUGGEST_ACCOUNT.
  #
  # Membership can lag one run for an account whose source mix is rebuilt later
  # in the same night: the run order is least-recently-succeeded first, not the
  # file's. It self-corrects the next night, and the hourly redraw is unaffected
  # because that reads each source's stored order.
  - id: popular
    title: "Popular"
    policy: consensus
    privacy: public
    # 54 is home-mix's own size, so the front page keeps the length it had when
    # it was one person's home mix.
    size: 54
    min_watched: 0
    consensus:
      sources:
        - {users: all, lane: home-mix}

  # Music only, which is what this slot pointed at before it was compiled.
  - id: trending
    title: "Trending"
    policy: consensus
    privacy: public
    size: 30
    min_watched: 0
    consensus:
      sources:
        - {users: all, lane: music-discover}

  # What a newly enrolled account opens onto, and a standing household feed for
  # everyone else. `users: all` names nobody, so it keeps working as accounts
  # come and go, and a member without the source lane yet is skipped rather
  # than aborting the mix. Filtered per viewer like any mix, so the same blend
  # hides what each person has already watched.
  - id: household
    title: "Household"
    policy: mix
    size: 40
    min_watched: 0
    mix:
      sources:
        - {users: all, lane: suggested, share: 0.6}
        - {users: all, lane: fresh-uploads, share: 0.4}
