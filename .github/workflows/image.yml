name: image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # A pull request builds the image and stops there. Nothing reaches the
  # registry that has not passed the tests on main.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: REVISION=${{ github.sha }}

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      # The same suite tests.yml runs. Duplicated on purpose: a green image is
      # the deploy artifact, so it must not be publishable while the tests are
      # red, and a separate workflow cannot gate this one.
      - run: python3 -m unittest discover -s tests -t tests
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: REVISION=${{ github.sha }}
          # No `:latest`. A deploy names the tag it wants, in the compose .env,
          # so what is running is recorded and a rollback has something to
          # point at.
          tags: ghcr.io/neskiredk/iv-suggest:${{ github.sha }}
